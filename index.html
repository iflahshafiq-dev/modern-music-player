<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicFlow — Premium Music Player</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================= -->
  <!-- LOADING SCREEN                -->
  <!-- ============================= -->
  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="loader-logo">MusicFlow</div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <div class="app" id="app">

    <!-- ============================= -->
    <!-- TOP NAVIGATION                -->
    <!-- ============================= -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">
          <span class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </span>
          <span class="logo-text">MusicFlow</span>
        </div>

        <nav class="main-nav" aria-label="Primary navigation">
          <a href="#" class="nav-link active" data-nav="home">Home</a>
          <a href="#" class="nav-link" data-nav="library">Library</a>
          <a href="#" class="nav-link" data-nav="playlists">Playlists</a>
          <a href="#" class="nav-link" data-nav="favorites">Favorites</a>
        </nav>
      </div>

      <div class="topbar-right">
        <button class="icon-btn" id="searchBtn" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <!-- ============================= -->
    <!-- MAIN PLAYER LAYOUT            -->
    <!-- ============================= -->
    <main class="player-layout">

      <!-- ===== LEFT: NOW PLAYING INFO ===== -->
      <section class="now-playing-panel glass-card" aria-label="Now playing details">
        <div class="album-art-wrap">
          <img class="album-art" id="albumArt" src="" alt="Album cover" />
          <div class="album-art-glow" id="albumGlow"></div>
        </div>

        <div class="track-info">
          <h1 class="track-title" id="trackTitle">Song Title</h1>
          <p class="track-artist" id="trackArtist">Artist Name</p>

          <div class="track-meta">
            <span class="meta-pill" id="trackGenre">Genre</span>
            <span class="meta-dot">•</span>
            <span class="meta-pill" id="trackYear">Year</span>
          </div>
        </div>

        <button class="favorite-btn" id="favoriteBtn" aria-label="Add to favorites" title="Add to favorites">
          <svg viewBox="0 0 24 24" fill="none" id="heartIcon">
            <path d="M12 21s-7.5-4.6-10.1-9.3C0.3 8.4 1.6 4.7 5 3.7c2.2-0.6 4.4 0.4 5.8 2.4C12.2 4.1 14.4 3.1 16.6 3.7c3.4 1 4.7 4.7 3.1 8-2.6 4.7-10.1 9.3-10.1 9.3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>Add to Favorites</span>
        </button>
      </section>

      <!-- ===== CENTER: CONTROLS ===== -->
      <section class="controls-panel glass-card" aria-label="Playback controls">
        <div class="controls-top">
          <button class="control-btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20L21 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M21 16v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>

          <button class="control-btn" id="prevBtn" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM10 12l9-7v14z"/></svg>
          </button>

          <button class="play-btn" id="playBtn" aria-label="Play" title="Play/Pause">
            <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>

          <button class="control-btn" id="nextBtn" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5l9 7-9 7z"/></svg>
          </button>

          <button class="control-btn" id="repeatBtn" aria-label="Repeat" title="Repeat">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 014-4h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 22l-4-4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <span class="time-label" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-handle" id="progressHandle"></div>
            </div>
          </div>
          <span class="time-label" id="durationTime">0:00</span>
        </div>

        <!-- Volume -->
        <div class="volume-section">
          <button class="icon-btn small" id="muteBtn" aria-label="Mute" title="Mute">
            <svg viewBox="0 0 24 24" fill="none" id="volumeIcon">
              <path d="M11 5L6 9H2v6h4l5 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M15.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M18.5 6a9 9 0 010 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="volume-bar" id="volumeBar">
            <div class="volume-track">
              <div class="volume-fill" id="volumeFill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== RIGHT: PLAYLIST ===== -->
      <aside class="playlist-panel glass-card" aria-label="Playlist">
        <div class="playlist-header">
          <h2>Up Next</h2>
          <span class="playlist-count" id="playlistCount">6 songs</span>
        </div>
        <ul class="playlist" id="playlist"></ul>
      </aside>

    </main>
  </div>

  <!-- Hidden native audio element that JS controls -->
  <audio id="audio" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
